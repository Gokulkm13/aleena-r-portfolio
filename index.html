  <head>
    <meta charset="UTF-8" />

    <title>Aleena R — HR Intern | Psychology & Research</title>
    <meta
      name="description"
      content="Personal portfolio of Aleena R, HR Intern at S & O Maritime Services Private Limited, with a background in Psychology and research."
    />
    <meta name="author" content="Aleena R" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>

    <!-- Open Graph / Social Meta -->
